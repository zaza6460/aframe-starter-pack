<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>

  <body>
    <a-scene>
      <a-assets>
        <img id="beach" src="images/bgsummerlab.png">
        <img id="bball" src="images/bball.jpeg">
        <img id="brella" src="images/umbrella.png">


      </a-assets>

      <a-sky src="#beach" rotation="0 -90 0"></a-sky>


      <a-plane position="0 0 0 " rotation="-90 0 0" width="10" height="10" color="#C2B280"></a-plane>

      
      <a-cylinder position="1 1 -3" radius="0.1" height="3.5" color="#FFC65D"></a-cylinder>

      <a-cone position="1 3 -3" radius-bottom="1.5" radius-top="0" height="0.5" color="#FF5555" material = "src:#brella; roughness: 0.4; metalness: 0"></a-cone>
      <a-sphere position="2 0.5 -3" radius="0.5" segments-width="64" segments-height="32"   material="src: #bball; roughness: 0.4; metalness: 0">
</a-sphere>

    </a-scene>
  </body>
</html>
